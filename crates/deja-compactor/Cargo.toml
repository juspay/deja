[package]
name = "deja-compactor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compacts deja landing objects into sealed, manifested session layouts in S3"

[dependencies]
flate2 = "1"
futures = "0.3"
object_store = { version = "0.11", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Content address of a seal: two sealers that read the same landing must write
# the same object keys, and two that read different landings must not share any.
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
zstd = "0.13"
# The declared configuration (`settings`): systems are declared in one TOML
# document with `DEJA__*` environment overrides, the convention the router and
# UCS already use. It lives in THIS crate because both readers need it and the
# orchestrator depends on this one, never the reverse.
config = { version = "0.15.25", default-features = false, features = ["toml"] }
# So a bad value names its field (`systems.prism.manages_stores`) rather than a
# line and column — the deployment can act on the first and not the second.
serde_path_to_error = "0.1.20"

[dev-dependencies]
# The seal's write ORDER is the safety property, and asserting it needs an
# ObjectStore that records what was written when — object_store's own trait is
# `async_trait`-based, so a test double has to be too.
async-trait = "0.1"

[[bin]]
name = "deja-compactor"
path = "src/main.rs"

[lints]
workspace = true
